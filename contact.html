<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Pimp ton shack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Vollkorn:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- SDK EmailJS : permet d'envoyer le formulaire sans avoir de serveur -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="logo">
    <a href="index.html"><img src="pimptonshack-logo.png" alt="Logo de la compagnie Pimp ton shack"></a>
  </div>
  <button class="burger" id="burger" aria-label="Ouvrir le menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="nav-links">
    <li><a href="index.html">Accueil</a></li>
    <li><a href="index.html#services">Services</a></li>
    <li><a href="index.html#gallery">Réalisations</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<header class="hero contact-hero">
  <div class="hero-content">
    <h1>Parle-nous de ton projet</h1>
    <p>Remplis le formulaire ci-dessous, on te répond rapidement.</p>
  </div>
</header>

<section>
  <form class="contact-form" id="contact-form">
    <label for="name">Nom</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Courriel</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit" class="cta-button">Envoyer</button>
    <p class="form-status" id="form-status"></p>
  </form>
</section>

<footer>
  <p>Pimp ton shack — une question, un projet ? <a href="contact.html">Contacte-nous</a>.</p>
  <p>&copy; 2026 Pimp ton shack. Tous droits réservés.</p>
</footer>

<script src="main.js"></script>
</body>
</html>
